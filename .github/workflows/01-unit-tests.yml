name: LR4 - Unit and Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: 1 - Unit tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests and coverage
        run: |
          mkdir -p reports
          python -m pytest tests/unit -v \
            --junitxml=reports/unit-report.xml \
            --cov=app.calculator \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=80

      - name: Publish unit test summary
        if: always()
        run: python scripts/publish_summary.py --kind unit

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            reports/unit-report.xml
            reports/coverage.xml
            reports/htmlcov/
          if-no-files-found: warn
          retention-days: 7

  integration-tests:
    name: 2 - Integration tests (FastAPI + PostgreSQL)
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/testdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PostgreSQL connection
        run: |
          python -c "import os, psycopg2; c = psycopg2.connect(os.environ['DATABASE_URL']); print('PostgreSQL is ready'); c.close()"

      - name: Run integration tests and coverage
        run: |
          mkdir -p reports
          python -m pytest tests/integration -v \
            --junitxml=reports/integration-report.xml \
            --cov=app.main \
            --cov=app.database \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/integration-coverage.xml \
            --cov-report=html:reports/integration-htmlcov \
            --cov-fail-under=80

      - name: Publish integration test summary
        if: always()
        run: python scripts/publish_summary.py --kind integration

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            reports/integration-report.xml
            reports/integration-coverage.xml
            reports/integration-htmlcov/
          if-no-files-found: warn
          retention-days: 7
